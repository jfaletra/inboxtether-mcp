name: Feature proposal
description: Propose future work without claiming it is implemented
title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: "Reader Mode is the current default. Draft and Send Assistant are planned. Do not post security vulnerabilities or private data."
  - type: textarea
    id: proposal
    attributes:
      label: Problem, proposed behavior, and security implications
      description: Describe the need with synthetic examples and note any write/send permissions.
    validations:
      required: true
