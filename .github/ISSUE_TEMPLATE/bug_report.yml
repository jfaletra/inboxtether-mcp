name: Bug report
description: Report Reader Mode behavior with synthetic reproduction data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not post security vulnerabilities, private mail, credentials, tunnel IDs, or raw logs. Use SECURITY.md for private reporting."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment versions
      description: OS, Python, MCP client, and IMAP software versions only; no hostnames or accounts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and expected versus actual behavior
      description: Use example.com identities and minimal synthetic messages. No real mailbox data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private infrastructure details, and personal mailbox data.
          required: true
