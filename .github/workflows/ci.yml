name: candidate-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-validated.txt -r requirements-test.txt -r requirements-audit.txt
      - run: python -m pip check
      - name: Complete synthetic regression
        run: |
          umask 022
          python -B run_tests.py
      - name: Loopback installer HTTP security
        run: python -B scripts/test_installer_http.py
      - run: python scripts/verify_release.py
      - run: python -m pip_audit -r constraints-validated.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Package the checked candidate
        run: python -B scripts/package_rc.py --output "$RUNNER_TEMP/inboxtether-rc1"
      - name: Self-contained Linux verification package
        run: python "$RUNNER_TEMP/inboxtether-rc1/inboxtether-2.1.0rc1-linux-verification/verify_linux_rc.py" --results "$RUNNER_TEMP/inboxtether-rc1-verification-results"
      - name: Retain rc1 packages and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inboxtether-2.1.0rc1-${{ github.event_name }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inboxtether-rc1
            ${{ runner.temp }}/inboxtether-rc1-verification-results
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
