name: dependency-audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check -r requirements-audit.txt
      - name: Audit runtime dependencies and transitive resolution
        run: python -m pip_audit -r requirements.txt --strict --progress-spinner off
      - name: Audit audit-tool dependencies
        run: python -m pip_audit -r requirements-audit.txt --strict --progress-spinner off
